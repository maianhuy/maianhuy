<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kho quản lý hàng</title>
<style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:30px}#loading{max-width:680px;margin:60px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 35px rgba(15,23,42,.08)}</style>
</head>
<body>
<div id="loading">Đang tải Kho quản lý hàng...</div>
<script>
(async()=>{
 try{
  const files=[
   'bundle2/part00.txt','bundle2/part01.txt',
   'bundle2/part02a.txt','bundle2/part02b.txt','bundle2/part02c.txt','bundle2/part02d.txt',
   'bundle2/part03a.txt','bundle2/part03b.txt','bundle2/part03c.txt','bundle2/part03d.txt',
   'bundle2/part04.txt'
  ];
  const parts=await Promise.all(files.map(async f=>{
   const r=await fetch(f,{cache:'no-store'});
   if(!r.ok)throw new Error('Không tải được '+f);
   return (await r.text()).trim();
  }));
  const b64=parts.join('');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('Trình duyệt không hỗ trợ giải nén gzip. Hãy mở bằng Chrome hoặc Edge mới nhất.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('loading').innerHTML='<b>Không thể tải website.</b><br><br>'+String(e.message||e);
  console.error(e);
 }
})();
</script>
</body>
</html>
