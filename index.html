<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho quản lý hàng</title></head><body><div id="loading" style="font-family:Arial,sans-serif;padding:30px">Đang tải Kho quản lý hàng...</div><script>(async()=>{try{const files=Array.from({length:9},(_,i)=>`chunks/part${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='Không thể tải dữ liệu website. Vui lòng kiểm tra lại các file triển khai.';console.error(e)}})();</script></body></html>
