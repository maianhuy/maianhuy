<!doctype html>
<!-- deploy: favicon-v3-20260814-1619 -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kho quản lý hàng</title>
<link rel="icon" href="/maianhuy/favicon-v3.ico" sizes="any">
<link rel="shortcut icon" href="/maianhuy/favicon-v3.ico">
<link rel="icon" type="image/png" sizes="64x64" href="/maianhuy/favicon-v3.png">
<link rel="apple-touch-icon" href="/maianhuy/favicon-v3.png">
<style>
body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:30px}
#loading{max-width:680px;margin:60px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 35px rgba(15,23,42,.08)}
</style>
</head>
<body>
<div id="loading">Đang tải Kho quản lý hàng...</div>
<script>
(async()=>{
 try{
  const files=[
   "bundle4/part00.txt","bundle4/part01.txt","bundle4/part02.txt","bundle4/part03.txt",
   "bundle4/part04.txt","bundle4/part05.txt","bundle4/part06.txt","bundle4/part07.txt",
   "bundle4/part08.txt","bundle4/part09.txt","bundle4/part10.txt","bundle4/part11.txt"
  ];
  const parts=await Promise.all(files.map(async f=>{
   const r=await fetch(f,{cache:'no-store'});
   if(!r.ok)throw new Error('Không tải được '+f);
   return (await r.text()).trim();
  }));
  const b64=parts.join('');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('Trình duyệt không hỗ trợ giải nén gzip. Hãy mở bằng Chrome hoặc Edge mới nhất.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();

  // Use the same company logo in the sidebar and browser tab.
  html=html.replace(
   /<img class="brand-logo" src="[^"]+" alt="Brand logo">/,
   '<img class="brand-logo" src="brand-logo.jpg?v=20260814-3" alt="Brand logo">'
  );

  // Remove any old favicon declarations from the bundled document so the
  // browser has only one canonical icon source.
  html=html.replace(/<link[^>]+rel=["\'][^"\']*icon[^"\']*["\'][^>]*>/gi,'');
  html=html.replace(/<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>/gi,'');

  // The loaded application replaces this loader document, so inject favicon +
  // final brand CSS into the application document itself as well.
  const assetFix=`
<link rel="icon" href="/maianhuy/favicon-v3.ico" sizes="any">
<link rel="shortcut icon" href="/maianhuy/favicon-v3.ico">
<link rel="icon" type="image/png" sizes="64x64" href="/maianhuy/favicon-v3.png">
<link rel="apple-touch-icon" href="/maianhuy/favicon-v3.png">
<style id="brand-logo-final-fix">
.brand{align-items:center!important;gap:12px!important}
.brand-logo{
 width:64px!important;height:64px!important;min-width:64px!important;flex:0 0 64px!important;
 display:block!important;object-fit:contain!important;object-position:center!important;
 padding:0!important;border-radius:12px!important;background:#25231f!important;
 box-shadow:0 6px 18px rgba(0,0,0,.30)!important
}
@media(max-width:800px){
 .brand{font-size:16px!important;gap:10px!important}
 .brand-logo{width:56px!important;height:56px!important;min-width:56px!important;flex-basis:56px!important}
 .brand-name small{font-size:10px!important;line-height:1.25!important}
}
</style>`;
  html=html.replace('</head>',assetFix+'\n</head>');

  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('loading').innerHTML='<b>Không thể tải website.</b><br><br>'+String(e.message||e);
  console.error(e);
 }
})();
</script>
</body>
</html>
